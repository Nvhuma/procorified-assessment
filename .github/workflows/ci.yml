name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: DB_SKIP_INTEGRATION=true npm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: procurifieddb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d procurifieddb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: procurifieddb
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_STRICT_CONFIG: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No standalone seed step: integration tests reseed deterministically per test case.
      - name: Run integration tests
        run: npm test
